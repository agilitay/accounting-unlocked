<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounting Unlocked — Display</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0a1628; --blue: #185FA5; --green: #2d7a1f; --gold: #ffab40; }
body { background: var(--bg); color: #e8edf4; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* HOLDING SCREEN */
#holding { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 20px; }
#holding h1 { font-size: 64px; font-weight: 900; letter-spacing: 0.04em; color: #e8f2ff; text-shadow: 0 0 40px rgba(24,95,165,0.6); }
#holding p { font-size: 22px; color: rgba(255,255,255,0.45); }
.lock-icon { font-size: 72px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

/* QUESTION SCREEN */
#question-screen { display: none; flex-direction: column; height: 100%; padding: 40px 60px; }
.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
.q-cat { font-size: 22px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.1em; }
.q-pts { background: var(--blue); color: #e8f2ff; border-radius: 10px; padding: 8px 24px; font-size: 28px; font-weight: 800; }
.q-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.q-text { font-size: 42px; font-weight: 700; line-height: 1.4; text-align: center; color: #ffffff; text-shadow: 0 2px 8px rgba(0,0,0,0.4); padding: 0 20px; }

/* ANSWER REVEAL */
.answer-reveal { margin-top: 40px; background: rgba(45,122,31,0.2); border: 2px solid rgba(45,122,31,0.6); border-radius: 16px; padding: 24px 36px; text-align: center; animation: slideUp 0.4s ease; display: none; }
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.ans-label { font-size: 16px; color: #6dbf57; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 10px; }
.ans-text { font-size: 36px; font-weight: 700; color: #a8e89a; line-height: 1.4; }

/* BUZZ BANNER */
#buzz-banner { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,171,64,0.15); border-top: 2px solid rgba(255,171,64,0.5); padding: 16px 40px; display: flex; align-items: center; gap: 16px; transform: translateY(100%); transition: transform 0.35s ease; }
#buzz-banner.visible { transform: translateY(0); }
#buzz-banner .bicon { font-size: 32px; animation: ring 0.5s ease; }
@keyframes ring { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-20deg)} 60%{transform:rotate(20deg)} }
#buzz-banner .btext { font-size: 28px; font-weight: 800; color: var(--gold); }
</style>
</head>
<body>

<div id="holding">
  <div class="lock-icon">🔓</div>
  <h1>Accounting Unlocked</h1>
  <p>Waiting for host to reveal a question…</p>
</div>

<div id="question-screen">
  <div class="q-header">
    <span class="q-cat" id="q-cat"></span>
    <span class="q-pts" id="q-pts"></span>
  </div>
  <div class="q-body">
    <div class="q-text" id="q-text"></div>
    <div class="answer-reveal" id="answer-reveal">
      <div class="ans-label">✓ Answer</div>
      <div class="ans-text" id="ans-text"></div>
    </div>
  </div>
</div>

<div id="buzz-banner">
  <span class="bicon">🔔</span>
  <span class="btext" id="buzz-text">Team buzzed in!</span>
</div>

<script>
const NTFY_TOPIC = 'accountingunlocked-agilitay-room1';
const NTFY_URL   = 'https://ntfy.sh/' + NTFY_TOPIC;

let buzzTimeout = null;

function show(mode, data) {
  const holding = document.getElementById('holding');
  const qscreen = document.getElementById('question-screen');
  const ansDiv  = document.getElementById('answer-reveal');

  if (mode === 'clear') {
    holding.style.display = 'flex';
    qscreen.style.display = 'none';
    ansDiv.style.display = 'none';
    clearBuzzBanner();
    return;
  }
  holding.style.display = 'none';
  qscreen.style.display = 'flex';
  document.getElementById('q-cat').textContent = data.cat || '';
  document.getElementById('q-pts').textContent = data.pts ? '$' + data.pts : '';
  document.getElementById('q-text').textContent = data.q || '';

  if (mode === 'answer') {
    document.getElementById('ans-text').textContent = data.a || '';
    ansDiv.style.display = 'block';
  } else {
    ansDiv.style.display = 'none';
  }
}

function showBuzz(name) {
  clearBuzzBanner();
  document.getElementById('buzz-text').textContent = name + ' buzzed in!';
  document.getElementById('buzz-banner').classList.add('visible');
  buzzTimeout = setTimeout(clearBuzzBanner, 6000);
}

function clearBuzzBanner() {
  if (buzzTimeout) clearTimeout(buzzTimeout);
  document.getElementById('buzz-banner').classList.remove('visible');
}

function connectNtfy() {
  const es = new EventSource(NTFY_URL + '/sse');
  es.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      const msg = (data.message || '').trim();
      if (msg.startsWith('DISPLAY:')) {
        const payload = JSON.parse(msg.slice(8));
        show(payload.mode, payload);
      } else if (msg.startsWith('BUZZ:')) {
        const parts = msg.split(':');
        const name = parts[2] || parts[1].replace('G', 'Team ');
        showBuzz(name);
      } else if (msg === 'RESET') {
        clearBuzzBanner();
      }
    } catch(_) {}
  };
  es.onerror = () => { es.close(); setTimeout(connectNtfy, 3000); };
}

connectNtfy();
</script>
</body>
</html>
